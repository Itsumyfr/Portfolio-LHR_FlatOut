<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Flat Out</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="assets/img/logo_t.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header ========== -->
    <header>
        <a href="index.html">
            <img id="logo" src="assets/img/logo_t.svg" alt="Logo Flat Out">
        </a>
        <nav>
            <a href="projets.html">Projets</a>
        </nav>
    </header>
    
    <!-- Section Hero ======== -->
     <section id="sectionHero">
        <div id="box">
            <div id="text">
                <p class="p-sectionHero" >@lhr_flatout</p>
                <h1 class="h1-sectionHero">Louna Henot-Roffé</h1>
                <h3 class="h3-sectionHero">PORTFOLIO 2k26</h3>
            </div>
            <a id="button" href="projets.html">Mes projets</a>
        </div>
     </section>

     <section id="sectionTeaser">
        <div id="teaser">
            <!-- Card 1 -->
            <div id="card">
                <div class="cardHeader">
                    <h2 class="h2-teaser">Cinéma</h2>
                    <a id="cardButton" href="projets.html">Voir plus</a>
                </div>
                <p class="p-teaser">J'ai participé à la réalisation de cours métrages, au montage </p>
                <img class="card_media" src="assets/img/2 Dreams 2 Nightmare - Large.png" alt="affiche du coursmétrage 2 dreams 2 nightmare">
                
            </div>
            <!-- Card 2 -->
            <div id="card">
                <div class="cardHeader">
                    <h2 class="h2-teaser">Design</h2>
                    <a id="cardButton" href="projets.html">Voir plus</a>
                </div>
                <p class="p-teaser" >yjshqwesg</p>
                <img class="card_media" src="assets/img/design_partiel.png" alt="Screenshoot d'une maquette d'application de musique.">
            </div>
            <!-- Card 3 -->
            <div id="card">
                <div class="cardHeader">
                    <h2 class="h2-teaser">Social</h2>
                    <a id="cardButton" href="projets.html">Voir plus</a>
                </div>
                <p class="p-teaser" >yjshqwesg</p>
                <img class="card_media" src="assets/img/crea_contenue.png" alt="Sreenshoot du feed instagram de lhr_flatout">
            </div>
        </div>
     </section>

     <!-- Section Teaser  ====== -->
      <section id="" >

      </section>

      <!-- Footer -->
      <footer>
        <div id="socials">
            <p class="p-footer1">Social</p>
            <div id="reseaux">
                <a href="https://www.instagram.com/lhr_flatout/">
                    <img class="media_reseaux" src="assets/img/logo_insta.png" alt="logo instagram">  
                </a>
                <a href="https://www.tiktok.com/@lhr_flatout">
                    <img class="media_reseaux" src="assets/img/logo_tiktok.png" alt="logo tiktok">   
                </a>
                <a href="https://www.linkedin.com/in/louna-henot-roffe">
                    <img class="media_reseaux" src="assets/img/logo_linkedin.png" alt="logo linkedin">   
                </a>
            </div>
        </div>
        <div id="midle">
            <img class="logoFooter" src="assets/img/logo_t.svg" alt="Logo Flat Out">
            <h2 class="h2-footer">Flat Out</h2>
        </div>
        <p class="p-footer2">© 2026 Flat Out</p>
      </footer>

    <!-- Scripts =========== -->
    <!-- GSAP === -->
    <script src="js/GSAP/gsap.min.js"></script>
    <script src="js/GSAP/Draggable.min.js"></script>
    <script src="js/GSAP/MotionPathPlugin.min.js"></script>
    <script src="js/GSAP/ScrollToPlugin.min.js"></script>
    <script src="js/GSAP/ScrollTrigger.min.js"></script>
    
    <!-- Main === -->
    <script src="js/main.js"></script>

</html>
